  else document.getElementById('app-sub').textContent = '未配置任何词库（请检查 data/manifest.js）';
});

// ==================== QUIZ SYSTEM ====================

let deepList = [];          // words marked as not remembered
let quizWords = [];         // active quiz word list
let quizMode  = '';         // current quiz mode
let quizIndex = 0;
let quizKnew = 0;
let quizForgot = 0;
let quizSkipped = 0;
let _currentQuizWord = null;

// --- View switcher ---
function showView(name) {
  ['header','#word-list','.controls','#quiz-view','#result-view','#deep-view'].forEach(sel => {
    const el = document.querySelector(sel);
    if (el) el.classList.add('hidden');
  });
  // Hide floating nav when leaving main view
  if (name !== 'main') {
    document.getElementById('float-nav').classList.add('hidden');
    document.getElementById('float-actions').classList.add('hidden');
  }
  if (name === 'main') {
    ['header','.controls','#word-list'].forEach(sel => {
      const el = document.querySelector(sel);
      if (el) el.classList.remove('hidden');
    });
  } else {
    const el = document.getElementById(name + '-view') ||
               document.getElementById(name);
    if (el) el.classList.remove('hidden');
  }
}

// --- Modal ---
function openQuizModal() {
  const cnt = deepList.length;
  document.getElementById('deep-modal-count').textContent = cnt + ' 词';
  const btn = document.getElementById('btn-modal-deep');
  btn.disabled = cnt === 0;

  // Adapt batch section to current vocab
  const hasCat = !!(currentVocabMeta && currentVocabMeta.hasCat);
  const hasWL  = !!(currentVocabMeta && currentVocabMeta.hasWL);
  const wlLabel = (currentVocabMeta && currentVocabMeta.wlLabel) || 'List';
  document.getElementById('quiz-batch-section').style.display = hasCat ? 'none' : '';
  document.getElementById('quiz-cat-section').style.display   = hasCat ? '' : 'none';
  if (!hasCat) {
    let html = '';
    if (hasWL) {
      const wlNums = [...new Set(WORDS.map(w => w.wl).filter(Boolean))].sort((a, b) => a - b);
      wlNums.forEach(wl => {
        const cnt = WORDS.filter(w => w.wl === wl).length;
        html += `<button class="btn-batch" onclick="startQuiz('wl_${wl}')">${wlLabel} ${wl}<br><small>${cnt} 词</small></button>`;
      });
    } else {
      const BATCH = 200, n = WORDS.length;
      for (let k = 0; k * BATCH < n; k++) {
        const start = k * BATCH, end = Math.min(start + BATCH, n);
        html += `<button class="btn-batch" onclick="startQuiz('batch_${k}')">第 ${k + 1} 批<br><small>第 ${start + 1}–${end} 词</small></button>`;
      }
    }
    document.getElementById('quiz-batch-section').innerHTML = html;
  }
  if (hasCat) {
    const c1 = WORDS.filter(w => w.cat === 1).length;
    const c2 = WORDS.filter(w => w.cat === 2).length;
    const c3 = WORDS.filter(w => w.cat === 3).length;
    document.getElementById('cat1-cnt').textContent = c1 + ' 词';
    document.getElementById('cat2-cnt').textContent = c2 + ' 词';
    document.getElementById('cat3-cnt').textContent = c3 + ' 词';
  }
  document.getElementById('btn-all-order').textContent  = '📋 全部 ' + WORDS.length + ' 词（顺序）';
  document.getElementById('btn-all-random').textContent = '🔀 全部 ' + WORDS.length + ' 词（随机）';

  document.getElementById('quiz-modal').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('quiz-modal').classList.add('hidden');
}
function startQuizRange() {
  const from = parseInt(document.getElementById('range-from').value, 10);
  const to   = parseInt(document.getElementById('range-to').value, 10);
  if (!from || !to || from < 1 || to > WORDS.length || from > to) {
    alert('请输入有效范围：1 – ' + WORDS.length); return;
  }
  startQuiz('range_' + from + '_' + to);
}
// listener added in DOMContentLoaded (element not yet in DOM here)

// --- Start quiz ---
function startQuiz(mode) {
  closeModal();
  let words = [];
  if      (mode.indexOf('range_') === 0) { const parts = mode.split('_'); words = WORDS.slice(parseInt(parts[1],10)-1, parseInt(parts[2],10)); }
  else if (mode.indexOf('batch_') === 0) { const k = parseInt(mode.slice(6), 10); words = WORDS.slice(k * 200, (k + 1) * 200); }
  else if (mode.indexOf('wl_') === 0)    { const wl = parseInt(mode.slice(3), 10); words = WORDS.filter(w => w.wl === wl); }
  else if (mode === 'cat1')       words = WORDS.filter(w => w.cat === 1);
  else if (mode === 'cat2')       words = WORDS.filter(w => w.cat === 2);
  else if (mode === 'cat3')       words = WORDS.filter(w => w.cat === 3);
  else if (mode === 'deeplist')   words = [...deepList];
  else if (mode === 'all-order')  words = [...WORDS];
  else if (mode === 'all-random') {
    words = [...WORDS];
    for (let i = words.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [words[i], words[j]] = [words[j], words[i]];
    }
  } else if (mode === 'random') {
    const pool = [...WORDS];
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    words = pool.slice(0, 100);
  }
  if (!words.length) { alert('该批次暂无单词'); return; }
  quizWords   = words;
  quizMode    = mode;
  quizIndex   = 0;
  quizKnew    = 0;
  quizForgot  = 0;
  quizSkipped = 0;
  showView('quiz');
  renderQuizCard();
}

// --- Render current quiz card ---
function renderQuizCard() {
  if (quizIndex >= quizWords.length) { showResult(); return; }
  const w = quizWords[quizIndex];
  _currentQuizWord = w;

  const pct = Math.round(quizIndex / quizWords.length * 100);
  document.getElementById('quiz-fill').style.width = pct + '%';
  document.getElementById('quiz-prog-text').textContent =
    (quizIndex + 1) + ' / ' + quizWords.length;

  document.getElementById('qc-num').textContent      = '# ' + w.id;
  document.getElementById('qc-word').textContent     = w.word;
  document.getElementById('qc-phonetic').textContent = w.phonetic || '';
  document.getElementById('qc-chinese').textContent  = w.detail  || '';
  const synEl = document.getElementById('qc-syn');
  synEl.textContent = w.syn || '';
  synEl.style.display = w.syn ? '' : 'none';

  document.getElementById('qc-chinese').classList.remove('revealed');
  synEl.classList.remove('revealed');
  document.getElementById('phase1-area').classList.remove('hidden');
  document.getElementById('phase2-area').classList.add('hidden');

  // Auto-play pronunciation when card loads (small delay keeps it inside gesture chain)
  setTimeout(() => speakCurrent(), 50);
}

function phase1Answer(remembered) {
  // Reveal Chinese (and synonyms), switch to phase 2
  document.getElementById('qc-chinese').classList.add('revealed');
  document.getElementById('qc-syn').classList.add('revealed');
  document.getElementById('phase1-area').classList.add('hidden');
  document.getElementById('phase2-area').classList.remove('hidden');
}

function phase2Answer(confirmed) {
  const w = _currentQuizWord;
  if (!confirmed) {
    if (!deepList.find(x => x.id === w.id)) deepList.push(w);
    quizForgot++;
  } else {
    if (quizMode === 'deeplist') {
      deepList = deepList.filter(x => x.id !== w.id);
    }
    quizKnew++;
  }
  saveToStorage();
  quizIndex++;
  renderQuizCard();
}

// ---- Quiz keyboard shortcuts ----
document.addEventListener('keydown', e => {
  const quizView = document.getElementById('quiz-view');
  if (!quizView || quizView.classList.contains('hidden')) return;
  const key = e.key;
  if (key !== 'ArrowLeft' && key !== 'ArrowRight' &&
      key !== 'a' && key !== 'A' && key !== 'd' && key !== 'D') return;
  e.preventDefault();

  const remembered = (key === 'ArrowLeft' || key === 'a' || key === 'A');
  const phase1 = document.getElementById('phase1-area');
  const phase2 = document.getElementById('phase2-area');

  if (phase1 && !phase1.classList.contains('hidden')) {
    phase1Answer(remembered);
  } else if (phase2 && !phase2.classList.contains('hidden')) {
    phase2Answer(remembered);
  }
});

function endQuiz() {
  if (!confirm('确定结束本次测试吗？已记录的结果不会丢失。')) return;
  // Words not yet reached are counted as skipped
  quizSkipped = quizWords.length - quizIndex;
  showResult();
}

function showResult() {
  showView('result');
  document.getElementById('res-knew').textContent   = quizKnew;
  document.getElementById('res-forgot').textContent = quizForgot;
  document.getElementById('res-total').textContent  = quizKnew + quizForgot;
  const skipped = quizWords.length - quizKnew - quizForgot;
  document.getElementById('res-sub').textContent =
    skipped > 0 ? ('（另有 ' + skipped + ' 词未完成）') : '';
}

function goToDeepList() {
  renderDeepList();
  showView('deep');
}
function backToMain() { showView('main'); }

// --- Deep list ---
function renderDeepList() {
  const badge = document.getElementById('deep-count-badge');
  badge.textContent = '（' + deepList.length + ' 词）';
  const container = document.getElementById('deep-list-content');
  if (!deepList.length) {
    container.innerHTML = '<div class="deep-empty">🎉 清单是空的，全都记住了！</div>';
    return;
  }
  container.innerHTML = deepList.map(w => {
    const fl = w.frequency >= 20 ? 'high' : w.frequency >= 12 ? 'medium' : 'low';
    const safe = w.word.replace(/'/g, "\\'");
    const phon = w.phonetic
      ? '<span class="phonetic">' + w.phonetic + '</span>' : '';
    return (
      '<div class="word-card" data-id="' + w.id +
        '" data-word="' + w.word + '" data-freq="' + w.frequency + '">' +
        '<span class="num">'  + w.id   + '</span>' +
        '<span class="word">' + w.word + '</span>' +
        '<button class="btn-speak" onclick="speak(\'' + safe + '\')">🔊</button>' +
        phon +
        '<span class="freq freq-' + fl + '">考频' + w.frequency + '次</span>' +
        '<span class="detail">' + w.detail + '</span>' +
      '</div>'
    );
  }).join('\n');
}

// --- PDF Export (deep list) ---
function exportPDF(withChinese) {
  const area  = document.getElementById('print-area');
  const title = (currentVocabMeta ? currentVocabMeta.name : '单词学习') + ' — 待记忆清单';
  const items = deepList.length ? deepList : [];
  if (!items.length) { alert('待记忆清单为空，无法导出'); return; }

  let lines = '';
  for (let i = 0; i < items.length; i++) {
    const w = items[i];
    var line = withChinese
      ? '<span class="pwi">' + w.id + '. ' + w.word + '</span> <span class="pp">' + (w.phonetic || '') + ' ' + (w.detail || '') + '</span>'
      : '<span class="pwi">' + w.id + '. ' + w.word + '</span> <span class="pp">' + (w.phonetic || '') + '</span>';
    lines += '<div class="pw-line">' + line + '</div>';
  }
  area.innerHTML =
    '<div class="print-title">' + title + '</div>' +
    '<div class="print-page">' + lines + '</div>';

  window.print();
}

// --- Export main word list PDF ---
function openExportModal() {
  if (!WORDS.length) { alert('当前词库无单词，无法导出'); return; }
  document.getElementById('export-vocab-info').textContent =
    (currentVocabMeta ? currentVocabMeta.name : '当前词库') + ' · 共 ' + WORDS.length + ' 词';
  document.getElementById('export-modal').classList.remove('hidden');
}
function closeExportModal() {
  document.getElementById('export-modal').classList.add('hidden');
}
function doExportPDF(withChinese) {
  closeExportModal();
  const area = document.getElementById('print-area');
  const title = (currentVocabMeta ? currentVocabMeta.name : '单词学习');

  let pageMode = 'all';
  const checked = document.querySelector('input[name="pageMode"]:checked');
  if (checked) pageMode = checked.value;

  const WORDS_PER_PAGE = 100;
  const totalPages = Math.ceil(WORDS.length / WORDS_PER_PAGE);

  let html = '<div class="print-title">' + title + '</div>';

  function line(w) {
    return withChinese
      ? '<span class="pwi">' + w.id + '. ' + w.word + '</span> <span class="pp">' + (w.phonetic || '') + ' ' + (w.detail || '') + '</span>'
      : '<span class="pwi">' + w.id + '. ' + w.word + '</span> <span class="pp">' + (w.phonetic || '') + '</span>';
  }

  for (let pageIdx = 0; pageIdx < totalPages; pageIdx++) {
    const pageNum = pageIdx + 1;
    if (pageMode === 'odd'  && pageNum % 2 === 0) continue;
    if (pageMode === 'even' && pageNum % 2 === 1) continue;

    const start = pageIdx * WORDS_PER_PAGE;
    const end = Math.min(start + WORDS_PER_PAGE, WORDS.length);
    let lines = '';
    for (let i = start; i < end; i++) {
      lines += '<div class="pw-line">' + line(WORDS[i]) + '</div>';
    }
    html += '<div class="print-page">' + lines + '</div>';
  }

  area.innerHTML = html;
  window.print();
}

// --- Speak current quiz word ---
function speakCurrent() {
  if (!_currentQuizWord) return;
  autoSpeak(_currentQuizWord.word);
}

function autoSpeak(word) {
  if (!window.speechSynthesis) return;
  // Cancel any ongoing speech; resume if paused (Chrome bug workaround)
  window.speechSynthesis.cancel();
  if (window.speechSynthesis.paused) window.speechSynthesis.resume();

  function doSpeak() {
    const utter = new SpeechSynthesisUtterance(word);
    utter.lang  = 'en-US';
    utter.rate  = 0.85;
    utter.pitch = 1;
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(x => x.lang.startsWith('en') && x.localService) ||
              voices.find(x => x.lang.startsWith('en'));
    if (v) utter.voice = v;
    window.speechSynthesis.speak(utter);
  }

  const voices = window.speechSynthesis.getVoices();
  if (voices.length > 0) {
    doSpeak();
  } else {
    // Voices not loaded yet — wait for the event, then speak
    const prev = window.speechSynthesis.onvoiceschanged;
    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.onvoiceschanged = prev;
      doSpeak();
    };
    // Fallback: some browsers never fire the event
    setTimeout(doSpeak, 400);
  }
}

    <button class="btn-random" onclick="startQuiz('random')">🎲 随机 100 词</button>
    <button class="btn-random" id="btn-all-order" style="background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7;margin-top:6px" onclick="startQuiz('all-order')">📋 全部（顺序）</button>
    <button class="btn-random" id="btn-all-random" style="background:#fff3e0;color:#e65100;border:1px solid #ffcc80;margin-top:6px" onclick="startQuiz('all-random')">🔀 全部（随机）</button>
    <button class="btn-modal-cancel" onclick="closeModal()">取消</button>
  </div>
</div>

<!-- ===== Quiz View ===== -->
<div id="quiz-view" class="hidden">
  <div class="quiz-topbar">
    <div class="quiz-prog-wrap">
      <div class="quiz-prog-track">
        <div class="quiz-prog-fill" id="quiz-fill" style="width:0%"></div>
      </div>
      <div class="quiz-prog-text" id="quiz-prog-text">0 / 0</div>
    </div>
    <button class="btn-end-quiz" onclick="endQuiz()">结束测试</button>
  </div>
  <div class="quiz-card" id="quiz-card">
    <div class="qc-num"      id="qc-num"></div>
    <div class="qc-word"     id="qc-word"></div>
    <button class="qc-speak-btn" id="qc-speak" onclick="speakCurrent()">🔊</button>
    <div class="qc-phonetic" id="qc-phonetic"></div>
    <div class="qc-divider"></div>
    <div class="qc-chinese" id="qc-chinese"></div>
    <div class="qc-syn" id="qc-syn"></div>
    <div id="phase1-area">
      <div class="qc-prompt">你还记得这个词的中文意思吗？</div>
      <div class="qc-btn-row">
        <button class="qc-btn-yes" onclick="phase1Answer(true)">记住了 ✓<br><small style="font-weight:400;opacity:.7">← / A</small></button>
        <button class="qc-btn-no"  onclick="phase1Answer(false)">没记住 ✗<br><small style="font-weight:400;opacity:.7">→ / D</small></button>
      </div>
    </div>
    <div id="phase2-area" class="hidden">
      <div class="qc-prompt">对照答案，最终确认：</div>
      <div class="qc-btn-row">
        <button class="qc-btn-yes" onclick="phase2Answer(true)">确认记住 ✓<br><small style="font-weight:400;opacity:.7">← / A</small></button>
        <button class="qc-btn-no"  onclick="phase2Answer(false)">还是没记住 ✗<br><small style="font-weight:400;opacity:.7">→ / D</small></button>
      </div>
    </div>
  </div>
</div>

<!-- ===== Result View ===== -->
<div id="result-view" class="hidden">
  <h2>🎉 本次背词完成！</h2>
  <p class="sub" id="res-sub"></p>
  <div class="result-stats">
    <div class="stat-box stat-knew">
      <div class="stat-num" id="res-knew">0</div>
      <div class="stat-label">记住了</div>
    </div>
    <div class="stat-box stat-forgot">
      <div class="stat-num" id="res-forgot">0</div>
      <div class="stat-label">没记住</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="res-total">0</div>
      <div class="stat-label">共背诵</div>
    </div>
  </div>
  <div class="result-btns">
    <button class="btn-primary"   onclick="goToDeepList()">📋 去待深刻记忆清单</button>
    <button class="btn-secondary" onclick="backToMain()">← 返回主页</button>
  </div>
</div>

<!-- ===== Deep List View ===== -->
<div id="deep-view" class="hidden">
  <div class="deep-topbar">
    <button class="btn-back" onclick="backToMain()">← 返回主页</button>
    <h2>待深刻记忆清单 <span id="deep-count-badge" style="font-weight:400;color:#888;font-size:.9rem"></span></h2>
    <button class="btn-start-quiz" style="margin-left:auto" onclick="openQuizModal()">📖 再次背诵</button>
    <button class="btn-export btn-export-cn" onclick="exportPDF(true)">导出PDF（含中文）</button>
    <button class="btn-export btn-export-no" onclick="exportPDF(false)">导出PDF（无中文）</button>
  </div>
  <div id="deep-list-content"></div>
</div>

<!-- ===== Export Modal ===== -->
<div id="export-modal" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:440px">
    <h2>📄 导出当前词库 PDF</h2>
    <p style="text-align:center;color:#888;font-size:.88rem;margin-bottom:16px" id="export-vocab-info"></p>
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <button class="btn-random" style="flex:1;background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7"
        onclick="doExportPDF(true)">含中文注释</button>
      <button class="btn-random" style="flex:1;background:#fff3e0;color:#e65100;border:1px solid #ffcc80"
        onclick="doExportPDF(false)">无中文注释</button>
    </div>
    <div class="page-mode-row">
      <label><input type="radio" name="pageMode" value="all" checked><span>全部页</span></label>
      <label><input type="radio" name="pageMode" value="odd"><span>奇数页</span></label>
      <label><input type="radio" name="pageMode" value="even"><span>偶数页</span></label>
    </div>
    <p style="text-align:center;color:#aaa;font-size:.78rem;margin-bottom:14px">
      奇数/偶数页用于手动双面打印：先打奇数页 → 翻面放回 → 打偶数页</p>
    <button class="btn-modal-cancel" onclick="closeExportModal()">取消</button>
  </div>
</div>

<!-- ===== Print Area ===== -->
<div id="print-area"></div>

<!-- Floating prev/next nav (right side) -->
<div id="float-nav" class="hidden">
  <button class="float-btn" id="float-prev" onclick="prevCard()" title="上一个">↑</button>
  <span id="float-pos"></span>
  <button class="float-btn" id="float-next" onclick="nextCard()" title="下一个">↓</button>
</div>

<!-- Floating action bar (bottom) -->
<div id="float-actions" class="hidden">
  <button class="float-btn" id="float-speak" onclick="floatSpeakCurrent()" title="读当前单词">🔊</button>
  <button class="float-btn" id="float-star" onclick="floatToggleStar()" title="标记/取消标记">☆</button>
  <button class="float-btn" id="float-read" onclick="floatAutoReadToggle()" title="开始/继续朗读">▶</button>
  <button class="float-btn" id="btn-toggle-detail" onclick="toggleDetail()" title="隐藏/显示注释">👁 注释</button>
</div>


<!-- ===== Back to top ===== -->
<button id="btn-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到顶部">↑</button>

<!-- ===== Dictation Config Modal ===== -->
<div id="dict-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <h2>🎧 听写模式设置</h2>
    <!-- Mode selection -->
    <div class="dict-row" style="flex-direction:column;gap:6px">
      <label>听写模式</label>
      <div class="dict-mode-row">
        <div class="dict-mode-card active" id="dictmode-auto" onclick="selectDictMode('auto')">
          🎧 自动播放<br><small>自动念词，到点翻答案</small>
        </div>
        <div class="dict-mode-card" id="dictmode-type" onclick="selectDictMode('type')">
          ⌨️ 打字听写<br><small>听音打字，逐词判断</small>
        </div>
      </div>
    </div>
    <!-- Common: start position & count -->
    <div class="dict-row">
      <label>从第几个词开始</label>
      <input type="number" id="dict-start" min="1" max="999" value="1">
    </div>
    <div class="dict-row">
      <label>共听写几个词</label>
      <input type="number" id="dict-count" min="1" max="999" value="20">
    </div>
    <!-- Auto-only settings -->
    <div id="dict-auto-options" class="dict-mode-section visible">
      <div class="dict-row">
        <label>每词重复次数</label>
        <div class="dict-seg" id="seg-repeat">
          <button class="active" onclick="setDictSeg('repeat',1,this)">1遍</button>
          <button onclick="setDictSeg('repeat',2,this)">2遍</button>
          <button onclick="setDictSeg('repeat',3,this)">3遍</button>
        </div>
      </div>
      <div class="dict-row">
        <label>每词间隔（秒）</label>
        <div class="dict-seg" id="seg-pause">
          <button onclick="setDictSeg('pause',3,this)">3秒</button>
          <button class="active" onclick="setDictSeg('pause',5,this)">5秒</button>
          <button onclick="setDictSeg('pause',8,this)">8秒</button>
        </div>
      </div>
    </div>
    <button class="btn-dict-start" onclick="startDictation()">开始听写</button>
    <button class="btn-modal-cancel" style="margin-top:8px" onclick="closeDictModal()">取消</button>
  </div>
</div>

<!-- ===== Dictation Player ===== -->
<div id="dict-player" class="hidden">
  <div class="dp-title">🎧 听写中</div>
  <div class="dp-prog-wrap">
    <div class="dp-prog-track"><div class="dp-prog-fill" id="dp-fill" style="width:0%"></div></div>
    <div class="dp-prog-text" id="dp-prog"></div>
  </div>
  <div class="dp-word-info">
    <div class="dp-word-num" id="dp-wordnum"></div>
    <div class="dp-repeat-dots" id="dp-dots"></div>
  </div>
  <div class="dp-btns">
    <button class="dp-btn" id="dp-pause-btn" onclick="toggleDictPause()">⏸ 暂停</button>
    <button class="dp-btn" onclick="dictSkip()">跳过 ›</button>
    <button class="dp-btn stop" onclick="stopDictation()">■ 停止</button>
  </div>
</div>

<!-- ===== Dictation Answer ===== -->
<div id="dict-answer" class="hidden">
  <div class="da-box">
    <h3>📋 听写答案</h3>
    <div class="da-list" id="da-list"></div>
    <button class="da-close" onclick="closeDictAnswer()">关闭</button>
  </div>
</div>

<!-- ===== Typing Dictation View ===== -->
<div id="dict-type-view" class="hidden">
  <div class="dtv-topbar">
    <div class="dtv-title">⌨️ 打字听写</div>
    <div class="dtv-prog-wrap">
      <div class="dtv-prog-track"><div class="dtv-prog-fill" id="dtv-fill" style="width:0%"></div></div>
      <div class="dtv-prog-text" id="dtv-prog-text"></div>
    </div>
    <button class="dtv-stop-btn" onclick="stopTypingDict()">■ 结束</button>
  </div>
  <div class="dtv-card">
    <div class="dtv-num" id="dtv-num"></div>
    <div class="dtv-prompt">请输入你听到的单词：</div>
    <button class="dtv-replay-btn" id="dtv-replay" onclick="replayTypingWord()">🔊 重听</button>
    <input class="dtv-input" type="text" id="dtv-input" placeholder="在此输入…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
    <div class="dtv-feedback" id="dtv-feedback"></div>
    <button class="dtv-confirm-btn" id="dtv-confirm" onclick="confirmTypingWord()">确认 →</button>
    <div class="dtv-score" id="dtv-score"></div>
  </div>
</div>

<!-- ===== Typing Dictation Result ===== -->
<div id="dict-type-result" class="hidden">
  <div class="dtr-box">
    <h3>📊 打字听写结果</h3>
    <div class="dtr-score-row">
      <div class="dtr-stat dtr-ok"><div class="dn" id="dtr-ok-n"></div><div class="dl">答对</div></div>
      <div class="dtr-stat dtr-err"><div class="dn" id="dtr-err-n"></div><div class="dl">答错/跳过</div></div>
      <div class="dtr-stat"><div class="dn" id="dtr-total-n"></div><div class="dl">共计</div></div>
    </div>
    <div class="dtr-list" id="dtr-list"></div>
    <button class="dtr-close" onclick="closeTypingResult()">关闭</button>
  </div>
</div>

</body>
</html>
